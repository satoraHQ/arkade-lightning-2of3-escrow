[package]
name = "ark-escrow"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"

[dependencies]
ark-core = "0.12.0"
ark-grpc = { version = "0.12.0", default-features = false, features = ["tls-native-roots"] }
futures = "0.3"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
anyhow = "1"
bitcoin = { version = "0.32.7", features = ["base64", "rand", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tonic = { version = "0.14", default-features = false }
tracing = "0.1"

[dev-dependencies]
ark-grpc = { version = "0.12.0", default-features = false, features = ["test-utils"] }
bytes = "1"
h2 = "0.4"
http = "1"
prost = "0.14"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
